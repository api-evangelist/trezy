aid: trezy
name: Trezy
description: >-
  Trezy is a Franco-Dutch fintech SaaS (Trezy SAS, founded 2021 in Paris by Quentin Lacointa)
  offering AI-driven cash flow management for small and medium businesses across Europe, the US,
  and Canada. It connects to 2,000+ banks via PSD2/Open Banking to deliver real-time cash position,
  automatic AI transaction categorization, 95%-accurate 12-month cash flow forecasting, real-time
  P&L, 27+ financial KPIs, supplier cost analysis, and OCR-based document management from a single
  platform starting at a free tier. Trezy also offers dedicated plans for external CFOs (DAF) and
  accounting firms, and integrates with QuickBooks Online and Pennylane. Backed by Seedcamp and
  Playfair Capital (with Kima Ventures and Discovery Ventures) in a €3M seed round. Trezy publishes
  an llms.txt corpus and an /.well-known/ai-plugin.json manifest but does not expose a public
  developer API.
